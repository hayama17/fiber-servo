name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Plan examples without containerd
        run: |
          npx tsx src/cli.ts plan examples/basic.tsx
          npx tsx src/cli.ts plan examples/replicaset.tsx
          npx tsx src/cli.ts plan examples/webapp.tsx
          npm run example:plan
